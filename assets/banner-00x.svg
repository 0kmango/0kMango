<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 698" width="1200" height="698" shape-rendering="crispEdges">
  <defs>
    <pattern id="pxgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <rect x="7" y="7" width="1" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="topfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0221" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d0221" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- animated base banner -->
  <image href="base-banner.png" x="0" y="0" width="1200" height="698" preserveAspectRatio="xMidYMid slice"/>

  <!-- subtle overlays for readability & aesthetic -->
  <rect width="1200" height="698" fill="#0d0221" opacity="0.18"/>
  <rect width="1200" height="220" fill="url(#topfade)"/>
  <rect width="1200" height="698" fill="url(#pxgrid)"/>

  <!-- border frame (same aesthetic as banner.svg) -->
  <rect x="8" y="8" width="1184" height="682" fill="none" stroke="#7b2cbf" stroke-width="4"/>
  <rect x="16" y="16" width="1168" height="666" fill="none" stroke="#00bbf9" stroke-width="2"/>
  <!-- corner pixels -->
  <g fill="#f15bb5">
    <rect x="8" y="8" width="16" height="16"/><rect x="1176" y="8" width="16" height="16"/>
    <rect x="8" y="674" width="16" height="16"/><rect x="1176" y="674" width="16" height="16"/>
  </g>
  <g fill="#00bbf9">
    <rect x="24" y="8" width="8" height="8"/><rect x="8" y="24" width="8" height="8"/>
    <rect x="1168" y="8" width="8" height="8"/><rect x="1184" y="24" width="8" height="8"/>
    <rect x="24" y="682" width="8" height="8"/><rect x="8" y="666" width="8" height="8"/>
    <rect x="1168" y="682" width="8" height="8"/><rect x="1184" y="666" width="8" height="8"/>
  </g>

  <!-- gothic pixel crosses -->
  <g id="cross-left" transform="translate(60,40)">
    <rect x="8" y="0" width="8" height="48" fill="#c77dff"/>
    <rect x="0" y="12" width="24" height="8" fill="#c77dff"/>
    <rect x="8" y="-8" width="8" height="8" fill="#f15bb5"/>
    <rect x="-8" y="12" width="8" height="8" fill="#00bbf9"/>
    <rect x="24" y="12" width="8" height="8" fill="#00bbf9"/>
    <rect x="8" y="48" width="8" height="8" fill="#f15bb5"/>
  </g>
  <g transform="translate(1108,40)">
    <rect x="8" y="0" width="8" height="48" fill="#c77dff"/>
    <rect x="0" y="12" width="24" height="8" fill="#c77dff"/>
    <rect x="8" y="-8" width="8" height="8" fill="#f15bb5"/>
    <rect x="-8" y="12" width="8" height="8" fill="#00bbf9"/>
    <rect x="24" y="12" width="8" height="8" fill="#00bbf9"/>
    <rect x="8" y="48" width="8" height="8" fill="#f15bb5"/>
  </g>

  <!-- pixel butterflies (aesthetic accents) -->
  <g transform="translate(180,70) scale(5)">
    <rect x="0" y="2" width="3" height="2" fill="#f15bb5"/>
    <rect x="1" y="1" width="3" height="1" fill="#ff8fab"/>
    <rect x="1" y="4" width="2" height="2" fill="#c77dff"/>
    <rect x="0" y="6" width="2" height="2" fill="#00bbf9"/>
    <rect x="2" y="6" width="1" height="1" fill="#9d4edd"/>
    <rect x="6" y="2" width="3" height="2" fill="#f15bb5"/>
    <rect x="5" y="1" width="3" height="1" fill="#ff8fab"/>
    <rect x="6" y="4" width="2" height="2" fill="#c77dff"/>
    <rect x="7" y="6" width="2" height="2" fill="#00bbf9"/>
    <rect x="6" y="6" width="1" height="1" fill="#9d4edd"/>
    <rect x="4" y="1" width="1" height="7" fill="#e0aaff"/>
    <rect x="3" y="0" width="1" height="1" fill="#00bbf9"/>
    <rect x="5" y="0" width="1" height="1" fill="#00bbf9"/>
  </g>
  <g transform="translate(940,70) scale(5)">
    <rect x="0" y="2" width="3" height="2" fill="#00bbf9"/>
    <rect x="1" y="1" width="3" height="1" fill="#90e0ef"/>
    <rect x="1" y="4" width="2" height="2" fill="#9d4edd"/>
    <rect x="0" y="6" width="2" height="2" fill="#f15bb5"/>
    <rect x="2" y="6" width="1" height="1" fill="#c77dff"/>
    <rect x="6" y="2" width="3" height="2" fill="#00bbf9"/>
    <rect x="5" y="1" width="3" height="1" fill="#90e0ef"/>
    <rect x="6" y="4" width="2" height="2" fill="#9d4edd"/>
    <rect x="7" y="6" width="2" height="2" fill="#f15bb5"/>
    <rect x="6" y="6" width="1" height="1" fill="#c77dff"/>
    <rect x="4" y="1" width="1" height="7" fill="#e0aaff"/>
    <rect x="3" y="0" width="1" height="1" fill="#f15bb5"/>
    <rect x="5" y="0" width="1" height="1" fill="#f15bb5"/>
  </g>

  <!-- Pixel art text: 00x -->
  <!-- Each glyph on a 7 (wide) x 9 (high) pixel grid, scaled -->
  <g transform="translate(330,40) scale(14)">
    <!-- 0 -->
    <g>
      <rect x="1" y="0" width="5" height="1" fill="#c77dff"/>
      <rect x="0" y="1" width="2" height="1" fill="#9d4edd"/>
      <rect x="5" y="1" width="2" height="1" fill="#9d4edd"/>
      <rect x="0" y="2" width="2" height="5" fill="#00bbf9"/>
      <rect x="5" y="2" width="2" height="5" fill="#f15bb5"/>
      <rect x="0" y="7" width="2" height="1" fill="#9d4edd"/>
      <rect x="5" y="7" width="2" height="1" fill="#9d4edd"/>
      <rect x="1" y="8" width="5" height="1" fill="#c77dff"/>
      <!-- inner accents -->
      <rect x="2" y="2" width="1" height="1" fill="#e0aaff"/>
      <rect x="4" y="6" width="1" height="1" fill="#e0aaff"/>
    </g>
    <!-- 0 -->
    <g transform="translate(9,0)">
      <rect x="1" y="0" width="5" height="1" fill="#f15bb5"/>
      <rect x="0" y="1" width="2" height="1" fill="#ff8fab"/>
      <rect x="5" y="1" width="2" height="1" fill="#ff8fab"/>
      <rect x="0" y="2" width="2" height="5" fill="#c77dff"/>
      <rect x="5" y="2" width="2" height="5" fill="#00bbf9"/>
      <rect x="0" y="7" width="2" height="1" fill="#ff8fab"/>
      <rect x="5" y="7" width="2" height="1" fill="#ff8fab"/>
      <rect x="1" y="8" width="5" height="1" fill="#f15bb5"/>
      <rect x="2" y="2" width="1" height="1" fill="#e0aaff"/>
      <rect x="4" y="6" width="1" height="1" fill="#e0aaff"/>
    </g>
    <!-- x (lowercase) -->
    <g transform="translate(18,0)">
      <rect x="0" y="2" width="2" height="1" fill="#00bbf9"/>
      <rect x="5" y="2" width="2" height="1" fill="#00bbf9"/>
      <rect x="1" y="3" width="2" height="1" fill="#90e0ef"/>
      <rect x="4" y="3" width="2" height="1" fill="#90e0ef"/>
      <rect x="2" y="4" width="3" height="1" fill="#c77dff"/>
      <rect x="2" y="5" width="3" height="1" fill="#f15bb5"/>
      <rect x="1" y="6" width="2" height="1" fill="#ff8fab"/>
      <rect x="4" y="6" width="2" height="1" fill="#ff8fab"/>
      <rect x="0" y="7" width="2" height="1" fill="#00bbf9"/>
      <rect x="5" y="7" width="2" height="1" fill="#00bbf9"/>
    </g>
  </g>

  <!-- small subtitle strip -->
  <rect x="430" y="185" width="340" height="34" rx="0" fill="#0d0221" opacity="0.55"/>
  <text x="600" y="209" font-family="'Courier New', Courier, monospace" font-size="20" fill="#ffe5ec" text-anchor="middle" letter-spacing="6">✟ 00x | okMango ✟</text>
</svg>
